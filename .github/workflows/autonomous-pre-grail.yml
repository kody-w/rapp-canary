name: Autonomous Pre-Grail Matrix

on:
  push:
    paths:
      - ".ring/**"
      - ".github/workflows/autonomous-pre-grail.yml"
      - ".github/workflows/stage-preprod.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: autonomous-pre-grail
  cancel-in-progress: false

env:
  RAPP_CANARY_REF: ${{ github.ref }}
  RAPP_CANARY_COMMIT: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      ring_inputs: ${{ steps.matrix.outputs.ring_inputs }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -I -m pip install --quiet -r rapp_brainstem/requirements-dev.txt

      - name: Test ring tooling
        run: python -I -m unittest discover .ring/tests -v

      - name: Enforce immutable Grail kernel
        run: |
          python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" \
            verify-kernel --repo "$GITHUB_WORKSPACE"

      - name: Run autonomous feature and failure matrix
        id: matrix
        run: |
          python -I "$GITHUB_WORKSPACE/.ring/tools/autonomous_test.py" \
            --python "$(command -v python)" \
            --bash "$(command -v bash)" \
            --json-output "$RUNNER_TEMP/AUTONOMOUS_TEST_REPORT.json" \
            --markdown-output "$RUNNER_TEMP/AUTONOMOUS_TEST_REPORT.md"
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "AUTONOMOUS_TEST_REPORT.json")
              .read_text(encoding="utf-8")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("ring_inputs=" + json.dumps(report["ring_inputs"]) + "\n")
          PY

  evidence:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAPP_NIGHTLY_REF: ${{ fromJSON(needs.test.outputs.ring_inputs).nightly.ref }}
      RAPP_NIGHTLY_COMMIT: ${{ fromJSON(needs.test.outputs.ring_inputs).nightly.commit }}
      RAPP_ALPHA_REF: ${{ fromJSON(needs.test.outputs.ring_inputs).alpha.ref }}
      RAPP_ALPHA_COMMIT: ${{ fromJSON(needs.test.outputs.ring_inputs).alpha.commit }}
      RAPP_BETA_REF: ${{ fromJSON(needs.test.outputs.ring_inputs).beta.ref }}
      RAPP_BETA_COMMIT: ${{ fromJSON(needs.test.outputs.ring_inputs).beta.commit }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Rebuild evidence without executing candidate code
        run: |
          python -I "$GITHUB_WORKSPACE/.ring/tools/autonomous_test.py" \
            --evidence-only \
            --python "$(command -v python)" \
            --bash "$(command -v bash)" \
            --json-output "$RUNNER_TEMP/AUTONOMOUS_TEST_REPORT.json" \
            --markdown-output "$RUNNER_TEMP/AUTONOMOUS_TEST_REPORT.md"

      - name: Publish trusted report
        run: cat "$RUNNER_TEMP/AUTONOMOUS_TEST_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: autonomous-pre-grail-report
          path: |
            ${{ runner.temp }}/AUTONOMOUS_TEST_REPORT.json
            ${{ runner.temp }}/AUTONOMOUS_TEST_REPORT.md
          if-no-files-found: warn
