name: Stage Preprod
run-name: Preprod from qualification ${{ inputs.qualification_run_id }}

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Green Test Pre-Grail Rings workflow run
        required: true
        type: string
      beta_preflight_run_id:
        description: Green Beta main preflight workflow run
        required: true
        type: string
      rollback_ref:
        description: Immutable Grail tag to restore
        required: true
        type: string
      soak_evidence_url:
        description: Commit-pinned raw URL to a rapp/1:soak JSON frame
        required: true
        type: string
      soak_evidence_sha256:
        description: SHA-256 of the soak evidence JSON
        required: true
        type: string
      owner:
        description: Team or person accountable for this candidate
        required: true
        type: string
      model_id:
        description: Explicit model qualified by the soak (auto is forbidden)
        required: true
        type: string
      expires_hours:
        description: Readiness lifetime before requalification is required
        required: true
        type: number
        default: 168

permissions:
  contents: read

concurrency:
  group: preprod
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      beta_commit: ${{ steps.evidence.outputs.beta_commit }}
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
      BETA_PREFLIGHT_RUN_ID: ${{ inputs.beta_preflight_run_id }}
      ROLLBACK_REF: ${{ inputs.rollback_ref }}
      SOAK_EVIDENCE_URL: ${{ inputs.soak_evidence_url }}
      SOAK_EVIDENCE_SHA256: ${{ inputs.soak_evidence_sha256 }}
      CANDIDATE_OWNER: ${{ inputs.owner }}
      MODEL_ID: ${{ inputs.model_id }}
      EXPIRES_HOURS: ${{ inputs.expires_hours }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate qualification and Beta evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$QUALIFICATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$BETA_PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]
          python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" verify-policy

          RAPP1_COMMIT=$(jq -r .rapp1_authority.commit .ring/preprod-policy.json)
          RAPP1_SPEC_SHA=$(jq -r .rapp1_authority.spec_sha256 .ring/preprod-policy.json)
          RAPP1_CONSTITUTION_SHA=$(jq -r \
            .rapp1_authority.constitution_sha256 .ring/preprod-policy.json)
          [[ "$RAPP1_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          COMPARE=$(gh api \
            "repos/kody-w/rapp-1/compare/$RAPP1_COMMIT...main")
          [[ "$(jq -r .status <<<"$COMPARE")" =~ ^(ahead|identical)$ ]]
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-filesize 4194304 \
            "https://raw.githubusercontent.com/kody-w/rapp-1/$RAPP1_COMMIT/SPEC.md" \
            -o "$RUNNER_TEMP/RAPP1-SPEC.md"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-filesize 1048576 \
            "https://raw.githubusercontent.com/kody-w/rapp-1/$RAPP1_COMMIT/CONSTITUTION.md" \
            -o "$RUNNER_TEMP/RAPP1-CONSTITUTION.md"
          [[ "$(sha256sum "$RUNNER_TEMP/RAPP1-SPEC.md" | awk '{print $1}')" == "$RAPP1_SPEC_SHA" ]]
          [[ "$(sha256sum "$RUNNER_TEMP/RAPP1-CONSTITUTION.md" | awk '{print $1}')" == "$RAPP1_CONSTITUTION_SHA" ]]
          grep -q '^### 11[.]1 Immutable Grail kernel conformance$' \
            "$RUNNER_TEMP/RAPP1-SPEC.md"
          grep -q '^## Article 15 — The Grail Never Changes$' \
            "$RUNNER_TEMP/RAPP1-CONSTITUTION.md"

          QUALIFICATION=$(gh api \
            "repos/kody-w/rapp-canary/actions/runs/$QUALIFICATION_RUN_ID")
          [[ "$(jq -r .name <<<"$QUALIFICATION")" == "Test Pre-Grail Rings" ]]
          [[ "$(jq -r .conclusion <<<"$QUALIFICATION")" == "success" ]]
          [[ "$(jq -r .path <<<"$QUALIFICATION")" == ".github/workflows/test-pre-grail-rings.yml" ]]
          [[ "$(jq -r .event <<<"$QUALIFICATION")" == "workflow_dispatch" ]]
          [[ "$(jq -r .head_branch <<<"$QUALIFICATION")" == "main" ]]
          QUALIFICATION_COMMIT=$(jq -r .head_sha <<<"$QUALIFICATION")
          QUALIFICATION_URL=$(jq -r .html_url <<<"$QUALIFICATION")
          QUALIFICATION_CREATED=$(jq -r .created_at <<<"$QUALIFICATION")

          mkdir -p "$RUNNER_TEMP/qualification"
          gh run download "$QUALIFICATION_RUN_ID" \
            -R kody-w/rapp-canary \
            -p 'pre-grail-attestations-*' \
            -D "$RUNNER_TEMP/qualification"
          BETA_ATTESTATION=$(find "$RUNNER_TEMP/qualification" -name beta.json -type f)
          [[ "$(printf '%s\n' "$BETA_ATTESTATION" | sed '/^$/d' | wc -l | tr -d ' ')" == "1" ]]
          BETA_COMMIT=$(jq -r .payload.commit "$BETA_ATTESTATION")
          CANARY_ATTESTATION=$(find "$RUNNER_TEMP/qualification" -name canary.json -type f)
          [[ "$(printf '%s\n' "$CANARY_ATTESTATION" | sed '/^$/d' | wc -l | tr -d ' ')" == "1" ]]
          [[ "$QUALIFICATION_COMMIT" == "$(jq -r .payload.commit "$CANARY_ATTESTATION")" ]]

          BETA_PREFLIGHT=$(gh api \
            "repos/kody-w/rapp-beta/actions/runs/$BETA_PREFLIGHT_RUN_ID")
          [[ "$(jq -r .name <<<"$BETA_PREFLIGHT")" == "preflight" ]]
          [[ "$(jq -r .conclusion <<<"$BETA_PREFLIGHT")" == "success" ]]
          [[ "$(jq -r .path <<<"$BETA_PREFLIGHT")" == ".github/workflows/preflight.yml" ]]
          [[ "$(jq -r .event <<<"$BETA_PREFLIGHT")" == "push" ]]
          [[ "$(jq -r .head_branch <<<"$BETA_PREFLIGHT")" == "main" ]]
          [[ "$(jq -r .head_sha <<<"$BETA_PREFLIGHT")" == "$BETA_COMMIT" ]]
          BETA_PREFLIGHT_URL=$(jq -r .html_url <<<"$BETA_PREFLIGHT")
          BETA_PREFLIGHT_CREATED=$(jq -r .created_at <<<"$BETA_PREFLIGHT")

          MAX_AGE_HOURS=$(jq -r .max_candidate_age_hours .ring/preprod-policy.json)
          python -I - "$QUALIFICATION_CREATED" "$BETA_PREFLIGHT_CREATED" "$MAX_AGE_HOURS" <<'PY'
          from datetime import datetime, timedelta, timezone
          import sys

          now = datetime.now(timezone.utc)
          maximum = timedelta(hours=int(sys.argv[3]))
          for label, raw in (("qualification", sys.argv[1]), ("Beta preflight", sys.argv[2])):
              value = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              if value > now or now - value > maximum:
                  raise SystemExit(f"{label} evidence is stale or future-dated: {raw}")
          PY

          [[ "$ROLLBACK_REF" =~ ^brainstem-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git ls-remote --exit-code \
            https://github.com/kody-w/rapp-installer.git \
            "refs/tags/$ROLLBACK_REF" "refs/tags/$ROLLBACK_REF^{}" >/dev/null
          [[ "$SOAK_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOAK_EVIDENCE_URL" =~ ^https://raw[.]githubusercontent[.]com/kody-w/rapp-canary/[0-9a-f]{40}/[.]ring/soak/[A-Za-z0-9._-]+[.]json$ ]]
          SOAK_COMMIT=$(cut -d/ -f6 <<<"$SOAK_EVIDENCE_URL")
          git merge-base --is-ancestor "$SOAK_COMMIT" "$GITHUB_SHA"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-filesize 1048576 \
            "$SOAK_EVIDENCE_URL" -o "$RUNNER_TEMP/soak-evidence.json"
          [[ "$(sha256sum "$RUNNER_TEMP/soak-evidence.json" | awk '{print $1}')" == "$SOAK_EVIDENCE_SHA256" ]]

          ENVIRONMENT=$(gh api \
            "repos/kody-w/rapp-canary/environments/preprod")
          REVIEWERS=$(jq '
            [.protection_rules[]
             | select(.type == "required_reviewers")
             | .reviewers[]] | length
          ' <<<"$ENVIRONMENT")
          MIN_REVIEWERS=$(jq -r .minimum_required_reviewers \
            .ring/preprod-policy.json)
          [[ "$REVIEWERS" -ge "$MIN_REVIEWERS" ]]
          [[ "$(jq -r .deployment_branch_policy.custom_branch_policies <<<"$ENVIRONMENT")" == "true" ]]
          BRANCH_POLICIES=$(gh api \
            "repos/kody-w/rapp-canary/environments/preprod/deployment-branch-policies")
          [[ "$(jq '[.branch_policies[] | select(.type == "branch" and .name == "main")] | length' \
            <<<"$BRANCH_POLICIES")" == "1" ]]

          echo "beta_commit=$BETA_COMMIT" >> "$GITHUB_OUTPUT"
          echo "qualification_commit=$QUALIFICATION_COMMIT" >> "$GITHUB_OUTPUT"
          echo "qualification_url=$QUALIFICATION_URL" >> "$GITHUB_OUTPUT"
          echo "beta_preflight_url=$BETA_PREFLIGHT_URL" >> "$GITHUB_OUTPUT"

      - name: Export the exact qualified payload into a Grail-shaped candidate
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/kody-w/rapp-installer.git \
            "$RUNNER_TEMP/candidate"
          git -C "$RUNNER_TEMP/candidate" checkout -q \
            -b "preprod/run-$QUALIFICATION_RUN_ID"
          python -I "$GITHUB_WORKSPACE/.ring/tools/grail_gate.py" verify \
            --run-id "$QUALIFICATION_RUN_ID" \
            --export-to "$RUNNER_TEMP/candidate"

      - name: Verify the archived rollback Brainstem frame
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preprod"
          python -I "$GITHUB_WORKSPACE/.ring/tools/brainstem_history.py" verify-all \
            --repo "$RUNNER_TEMP/candidate" \
            --directory "$GITHUB_WORKSPACE/.ring/brainstem-history"
          ROLLBACK_FRAME="$GITHUB_WORKSPACE/.ring/brainstem-history/$ROLLBACK_REF.json"
          test -f "$ROLLBACK_FRAME"
          python -I "$GITHUB_WORKSPACE/.ring/tools/brainstem_history.py" verify \
            --repo "$RUNNER_TEMP/candidate" \
            --frame "$ROLLBACK_FRAME"
          cp -R "$GITHUB_WORKSPACE/.ring/brainstem-history" \
            "$RUNNER_TEMP/preprod/brainstem-history"

      - name: Package immutable candidate and readiness manifest
        id: package
        shell: bash
        env:
          BETA_COMMIT: ${{ steps.evidence.outputs.beta_commit }}
          QUALIFICATION_COMMIT: ${{ steps.evidence.outputs.qualification_commit }}
          QUALIFICATION_URL: ${{ steps.evidence.outputs.qualification_url }}
          BETA_PREFLIGHT_URL: ${{ steps.evidence.outputs.beta_preflight_url }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/preprod"
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP/soak-evidence.json" "$OUT/soak-evidence.json"
          ARTIFACT="rapp-preprod-${BETA_COMMIT:0:12}.tar.gz"
          python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" package \
            --source "$RUNNER_TEMP/candidate" \
            --artifact "$OUT/$ARTIFACT" \
            --manifest "$OUT/readiness.json" \
            --beta-commit "$BETA_COMMIT" \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --qualification-url "$QUALIFICATION_URL" \
            --qualification-commit "$QUALIFICATION_COMMIT" \
            --beta-preflight-run-id "$BETA_PREFLIGHT_RUN_ID" \
            --beta-preflight-url "$BETA_PREFLIGHT_URL" \
            --soak-evidence "$RUNNER_TEMP/soak-evidence.json" \
            --soak-evidence-url "$SOAK_EVIDENCE_URL" \
            --soak-evidence-sha256 "$SOAK_EVIDENCE_SHA256" \
            --owner "$CANDIDATE_OWNER" \
            --control-plane-commit "$GITHUB_SHA" \
            --model-id "$MODEL_ID" \
            --rollback-ref "$ROLLBACK_REF" \
            --rollback-frame "$OUT/brainstem-history/$ROLLBACK_REF.json" \
            --expires-hours "$EXPIRES_HOURS"
          SHA=$(python -I - "$OUT/readiness.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["subject"]["artifact_sha256"])
          PY
          )
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Preprod candidate awaiting verification and approval"
            echo
            echo "- Beta commit: \`$BETA_COMMIT\`"
            echo "- Artifact: \`$ARTIFACT\`"
            echo "- SHA-256: \`$SHA\`"
            echo "- Rollback: \`$ROLLBACK_REF\`"
            echo "- Owner: \`$CANDIDATE_OWNER\`"
            echo "- Model: \`$MODEL_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preprod-candidate-${{ steps.evidence.outputs.beta_commit }}
          path: ${{ runner.temp }}/preprod/*
          if-no-files-found: error
          retention-days: 90

  verify:
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      MODEL_ID: ${{ inputs.model_id }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: preprod-candidate-${{ needs.stage.outputs.beta_commit }}
          path: ${{ runner.temp }}/preprod

      - name: Verify and exercise the immutable artifact
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.stage.outputs.artifact_name }}
          BETA_COMMIT: ${{ needs.stage.outputs.beta_commit }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          set -euo pipefail
          python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" verify \
            --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            --manifest "$RUNNER_TEMP/preprod/readiness.json" \
            --expected-beta-commit "$BETA_COMMIT" \
            --expected-qualification-run "$QUALIFICATION_RUN_ID"
          python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" extract \
            --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            --destination "$RUNNER_TEMP/candidate"
          test -f "$RUNNER_TEMP/candidate/install.sh"
          test -f "$RUNNER_TEMP/candidate/rapp_brainstem/brainstem.py"

      - name: Parse Windows PowerShell 5.1 installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:RUNNER_TEMP\candidate\install.ps1",
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }

  dependencies:
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: preprod-candidate-${{ needs.stage.outputs.beta_commit }}
          path: ${{ runner.temp }}/preprod

      - name: Resolve without executing dependency code
        id: dependencies
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.stage.outputs.artifact_name }}
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          CANDIDATE="$RUNNER_TEMP/candidate"
          MATERIAL="$RUNNER_TEMP/dependency-$KEY"
          python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" extract \
            --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            --destination "$CANDIDATE"
          REQUIREMENTS="$CANDIDATE/rapp_brainstem/requirements.txt"
          ARCHIVE="$RUNNER_TEMP/dependency-material-$KEY.tar.gz"
          python -I "$GITHUB_WORKSPACE/.ring/tools/build_dependency_material.py" \
            --requirements "$REQUIREMENTS" \
            --output "$MATERIAL" \
            --platform "$KEY" \
            --audit-lock "$GITHUB_WORKSPACE/.ring/tooling/pip-audit.lock" \
            --artifact "$ARCHIVE"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preprod-dependencies-${{ needs.stage.outputs.beta_commit }}-${{ steps.dependencies.outputs.key }}
          path: ${{ steps.dependencies.outputs.archive }}
          if-no-files-found: error
          retention-days: 90

      - name: Exercise the production offline runtime with frozen test tools
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.stage.outputs.artifact_name }}
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          ARCHIVE="$RUNNER_TEMP/dependency-material-$KEY.tar.gz"
          RUNTIME="$RUNNER_TEMP/sealed-runtime"
          python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" \
            prepare-candidate-runtime \
            --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            --manifest "$RUNNER_TEMP/preprod/readiness.json" \
            --destination "$RUNTIME" \
            --state-dir "$RUNNER_TEMP/sealed-state" \
            --platform "$KEY" \
            --material "dependency-material-$KEY=$ARCHIVE"
          (
            export HOME="$RUNNER_TEMP/runtime-home"
            export PORT=17405
            exec python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" \
              launch-candidate-runtime \
              --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
              --manifest "$RUNNER_TEMP/preprod/readiness.json" \
              --state-dir "$RUNNER_TEMP/launch-state" \
              --platform "$KEY" \
              --material "dependency-material-$KEY=$ARCHIVE" \
              --evidence "$RUNNER_TEMP/kernel-launch.json"
          ) > "$RUNNER_TEMP/production-smoke.log" 2>&1 &
          PROD_PID=$!
          trap 'kill "$PROD_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            sleep 2
            if curl -sf --max-time 2 http://localhost:17405/health \
                -o "$RUNNER_TEMP/production-health.json"; then
              break
            fi
            if [ "$attempt" = 45 ]; then
              tail -80 "$RUNNER_TEMP/production-smoke.log" || true
              exit 1
            fi
          done
          python -I - \
            "$RUNNER_TEMP/production-health.json" \
            "$RUNNER_TEMP/kernel-launch.json" \
            "${{ inputs.model_id }}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              health = json.load(handle)
          with open(sys.argv[2], encoding="utf-8") as handle:
              launch = json.load(handle)
          assert health.get("status") in {"ok", "unauthenticated"}, health
          assert health.get("model") == sys.argv[3], health
          assert launch.get("execution_mode") == "verified-memory-snapshot", launch
          assert launch.get("kernel_sha256"), launch
          assert launch.get("grail_id"), launch
          PY
          kill "$PROD_PID"
          wait "$PROD_PID" 2>/dev/null || true
          trap - EXIT

          TEST_VENV="$RUNNER_TEMP/test-runtime"
          python -I -m venv "$TEST_VENV"
          if [ "$RUNNER_OS" = "Windows" ]; then
            TEST_PY="$TEST_VENV/Scripts/python.exe"
            TEST_PY_FOR_SHIM=$(cygpath -u "$TEST_PY")
          else
            TEST_PY="$TEST_VENV/bin/python"
            TEST_PY_FOR_SHIM="$TEST_PY"
          fi
          "$TEST_PY" -I -m pip install \
            --no-index \
            --find-links "$RUNTIME/dependencies/wheelhouse" \
            -r "$RUNTIME/dependencies/requirements.lock"
          "$TEST_PY" -I -m pip install \
            --no-index \
            --find-links "$RUNTIME/dependencies/test-wheelhouse" \
            -r "$RUNTIME/dependencies/test-requirements.lock"
          mkdir -p "$RUNNER_TEMP/test-bin"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$TEST_PY_FOR_SHIM" \
            > "$RUNNER_TEMP/test-bin/python3"
          chmod +x "$RUNNER_TEMP/test-bin/python3"
          export PATH="$RUNNER_TEMP/test-bin:$PATH"
          export PIP_NO_INDEX=1
          (
            cd "$RUNTIME/src"
            bash tests/test_installer.sh
          )

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preprod-runtime-proof-${{ needs.stage.outputs.beta_commit }}-${{ steps.dependencies.outputs.key }}
          path: |
            ${{ runner.temp }}/kernel-launch.json
            ${{ runner.temp }}/production-health.json
          if-no-files-found: error
          retention-days: 90

  drill:
    needs:
      - stage
      - dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      ROLLBACK_REF: ${{ inputs.rollback_ref }}
      MODEL_ID: ${{ inputs.model_id }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: preprod-candidate-${{ needs.stage.outputs.beta_commit }}
          path: ${{ runner.temp }}/preprod

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: preprod-dependencies-${{ needs.stage.outputs.beta_commit }}-linux
          path: ${{ runner.temp }}/drill-material

      - name: Recreate the exact artifact as a candidate repository
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.stage.outputs.artifact_name }}
        run: |
          set -euo pipefail
          python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" extract \
            --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            --destination "$RUNNER_TEMP/candidate"
          git -C "$RUNNER_TEMP/candidate" init -q
          git -C "$RUNNER_TEMP/candidate" config user.name "Preprod Gate"
          git -C "$RUNNER_TEMP/candidate" config user.email "preprod@rapp.invalid"
          git -C "$RUNNER_TEMP/candidate" add -A
          git -C "$RUNNER_TEMP/candidate" commit -qm "immutable preprod candidate"
          git -C "$RUNNER_TEMP/candidate" remote add origin \
            https://github.com/kody-w/rapp-installer.git
          git -C "$RUNNER_TEMP/candidate" fetch --quiet origin main
          python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" extract \
            --artifact "$RUNNER_TEMP/drill-material/dependency-material-linux.tar.gz" \
            --destination "$RUNNER_TEMP/drill-dependencies"

      - name: Exercise fresh, upgrade, and destructive repair
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          export PIP_NO_INDEX=1
          export PIP_FIND_LINKS="$RUNNER_TEMP/drill-dependencies/wheelhouse $RUNNER_TEMP/drill-dependencies/test-wheelhouse"
          GITHUB_MODEL="$MODEL_ID" PREFLIGHT_PORT=17401 bash tests/preflight_local.sh fresh
          GITHUB_MODEL="$MODEL_ID" PREFLIGHT_PORT=17402 bash tests/preflight_local.sh upgrade
          GITHUB_MODEL="$MODEL_ID" PREFLIGHT_PORT=17403 bash tests/preflight_local.sh repair

      - name: Rehearse the immutable rollback installer
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_HOME="$RUNNER_TEMP/rollback-home"
          SHIMS="$RUNNER_TEMP/rollback-shims"
          mkdir -p "$ROLLBACK_HOME" "$SHIMS"
          cat > "$SHIMS/lsof" <<'EOF'
          #!/bin/bash
          exit 0
          EOF
          cat > "$SHIMS/open" <<'EOF'
          #!/bin/bash
          exit 0
          EOF
          cat > "$SHIMS/curl" <<'EOF'
          #!/bin/bash
          for arg in "$@"; do
            case "$arg" in
              *github.com/login/*|*api.github.com/copilot_internal/*|*raw.githubusercontent.com*) exit 6 ;;
            esac
          done
          exec /usr/bin/curl "$@"
          EOF
          chmod +x "$SHIMS/lsof" "$SHIMS/open" "$SHIMS/curl"

          ROLLBACK_FRAME="$RUNNER_TEMP/preprod/brainstem-history/$ROLLBACK_REF.json"
          ROLLBACK_COMMIT=$(jq -r .commit "$ROLLBACK_FRAME")
          [[ "$ROLLBACK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git -C "$RUNNER_TEMP/candidate" cat-file -e "$ROLLBACK_COMMIT^{commit}"
          EXPECTED_VERSION=$(git -C "$RUNNER_TEMP/candidate" \
            show "$ROLLBACK_COMMIT:rapp_brainstem/VERSION" | tr -d '[:space:]')
          mkdir -p "$ROLLBACK_HOME/.brainstem/state"
          printf '{"access_token":"ghu_PREPROD_ROLLBACK","saved_at":1}\n' \
            > "$ROLLBACK_HOME/.brainstem/state/.copilot_token"
          printf 'preprod-rollback-secret\n' \
            > "$ROLLBACK_HOME/.brainstem/state/.brainstem_secret"
          printf '{"model":"gpt-4o"}\n' \
            > "$ROLLBACK_HOME/.brainstem/state/.brainstem_model"
          printf '[{"type":"preprod-rollback-marker"}]\n' \
            > "$ROLLBACK_HOME/.brainstem/state/.brainstem_book.json"

          (
            export HOME="$ROLLBACK_HOME"
            export PATH="$SHIMS:$PATH"
            export PORT=17404
            export BRAINSTEM_VERSION="$ROLLBACK_COMMIT"
            script -qec "bash '$RUNNER_TEMP/candidate/install.sh'" \
              "$RUNNER_TEMP/rollback-install.log"
          ) &
          INSTALLER_PID=$!
          trap 'kill "$INSTALLER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 90); do
            sleep 2
            if /usr/bin/curl -sf --max-time 2 \
                http://localhost:17404/health \
                -o "$RUNNER_TEMP/rollback-health.json"; then
              break
            fi
            if [ "$attempt" = 90 ]; then
              tail -80 "$RUNNER_TEMP/rollback-install.log" || true
              exit 1
            fi
          done
          python -I - "$RUNNER_TEMP/rollback-health.json" "$EXPECTED_VERSION" <<'PY'
          import json
          import sys
          value = json.load(open(sys.argv[1]))
          assert value["version"] == sys.argv[2], value
          print("rollback booted:", value["version"])
          PY
          [[ "$(git -C "$ROLLBACK_HOME/.brainstem/src" rev-parse HEAD)" == "$ROLLBACK_COMMIT" ]]
          LEGACY="$ROLLBACK_HOME/.brainstem/src/rapp_brainstem"
          grep -q "ghu_PREPROD_ROLLBACK" "$LEGACY/.copilot_token"
          grep -q "preprod-rollback-secret" "$LEGACY/.brainstem_secret"
          grep -q "gpt-4o" "$LEGACY/.brainstem_model"
          grep -q "preprod-rollback-marker" "$LEGACY/.brainstem_book.json"

          LISTENER=$(lsof -ti tcp:17404 -sTCP:LISTEN 2>/dev/null | head -1 || true)
          [ -z "$LISTENER" ] || kill "$LISTENER"
          wait "$INSTALLER_PID" 2>/dev/null || true
          trap - EXIT

  seal:
    needs:
      - stage
      - verify
      - dependencies
      - drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    environment:
      name: preprod
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: preprod-candidate-${{ needs.stage.outputs.beta_commit }}
          path: ${{ runner.temp }}/preprod

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: preprod-dependencies-${{ needs.stage.outputs.beta_commit }}-*
          path: ${{ runner.temp }}/preprod/dependencies
          merge-multiple: true

      - name: Re-verify after approval
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.stage.outputs.artifact_name }}
          BETA_COMMIT: ${{ needs.stage.outputs.beta_commit }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          MATERIAL_ARGS=()
          for material in "$RUNNER_TEMP/preprod/dependencies/"*.tar.gz; do
            name=$(basename "$material" .tar.gz)
            MATERIAL_ARGS+=(--material "$name=$material")
          done
          python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" verify \
            --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            --manifest "$RUNNER_TEMP/preprod/readiness.json" \
            --expected-beta-commit "$BETA_COMMIT" \
            --expected-qualification-run "$QUALIFICATION_RUN_ID"
          python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" seal \
            --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            --manifest "$RUNNER_TEMP/preprod/readiness.json" \
            --output "$RUNNER_TEMP/preprod/seaworthy.json" \
            --preprod-run-id "${{ github.run_id }}" \
            --preprod-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --approval-authority "github-environment:preprod" \
            "${MATERIAL_ARGS[@]}"
          python -I "$GITHUB_WORKSPACE/.ring/tools/preprod_gate.py" verify \
            --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            --manifest "$RUNNER_TEMP/preprod/seaworthy.json" \
            --expected-beta-commit "$BETA_COMMIT" \
            --expected-qualification-run "$QUALIFICATION_RUN_ID" \
            "${MATERIAL_ARGS[@]}"

      - name: Attest immutable Preprod artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/preprod/${{ needs.stage.outputs.artifact_name }}

      - name: Attest sealed readiness manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/preprod/seaworthy.json

      - name: Attest sealed dependency materials
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/preprod/dependencies/*.tar.gz

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: seaworthy-preprod-${{ needs.stage.outputs.beta_commit }}
          path: |
            ${{ runner.temp }}/preprod/${{ needs.stage.outputs.artifact_name }}
            ${{ runner.temp }}/preprod/seaworthy.json
            ${{ runner.temp }}/preprod/soak-evidence.json
            ${{ runner.temp }}/preprod/brainstem-history
            ${{ runner.temp }}/preprod/dependencies/*.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Record the seaworthy handoff
        shell: bash
        env:
          CANDIDATE_OWNER: ${{ inputs.owner }}
          SOAK_EVIDENCE_URL: ${{ inputs.soak_evidence_url }}
          ROLLBACK_REF: ${{ inputs.rollback_ref }}
        run: |
          {
            echo "## Preprod candidate sealed"
            echo
            echo "- Beta commit: \`${{ needs.stage.outputs.beta_commit }}\`"
            echo "- Artifact: \`${{ needs.stage.outputs.artifact_name }}\`"
            echo "- SHA-256: \`${{ needs.stage.outputs.artifact_sha256 }}\`"
            echo "- Qualification run: \`${{ inputs.qualification_run_id }}\`"
            echo "- Rollback target: \`$ROLLBACK_REF\`"
            echo "- Owner: \`$CANDIDATE_OWNER\`"
            echo "- Soak evidence: $SOAK_EVIDENCE_URL"
            echo
            echo "Grail must consume this exact artifact digest. Any byte change requires a new qualification."
          } >> "$GITHUB_STEP_SUMMARY"
