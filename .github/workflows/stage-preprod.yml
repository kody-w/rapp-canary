name: Stage Preprod
run-name: Preprod from qualification ${{ inputs.qualification_run_id }}

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Green Test Pre-Grail Rings workflow run
        required: true
        type: string
      beta_preflight_run_id:
        description: Green Beta main preflight workflow run
        required: true
        type: string
      rollback_ref:
        description: Immutable Grail tag to restore
        required: true
        type: string
      soak_evidence_url:
        description: GitHub URL containing real-use soak evidence
        required: true
        type: string
      owner:
        description: Team or person accountable for this candidate
        required: true
        type: string
      model_id:
        description: Explicit production model id (auto is forbidden)
        required: true
        type: string
      expires_hours:
        description: Readiness lifetime before requalification is required
        required: true
        type: number
        default: 168

permissions:
  contents: read

concurrency:
  group: preprod
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      beta_commit: ${{ steps.evidence.outputs.beta_commit }}
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
      BETA_PREFLIGHT_RUN_ID: ${{ inputs.beta_preflight_run_id }}
      ROLLBACK_REF: ${{ inputs.rollback_ref }}
      SOAK_EVIDENCE_URL: ${{ inputs.soak_evidence_url }}
      CANDIDATE_OWNER: ${{ inputs.owner }}
      MODEL_ID: ${{ inputs.model_id }}
      EXPIRES_HOURS: ${{ inputs.expires_hours }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate qualification and Beta evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$QUALIFICATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$BETA_PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]

          QUALIFICATION=$(gh api \
            "repos/kody-w/rapp-canary/actions/runs/$QUALIFICATION_RUN_ID")
          [[ "$(jq -r .name <<<"$QUALIFICATION")" == "Test Pre-Grail Rings" ]]
          [[ "$(jq -r .conclusion <<<"$QUALIFICATION")" == "success" ]]
          [[ "$(jq -r .path <<<"$QUALIFICATION")" == ".github/workflows/test-pre-grail-rings.yml" ]]
          [[ "$(jq -r .event <<<"$QUALIFICATION")" == "workflow_dispatch" ]]
          [[ "$(jq -r .head_branch <<<"$QUALIFICATION")" == "main" ]]
          QUALIFICATION_URL=$(jq -r .html_url <<<"$QUALIFICATION")
          QUALIFICATION_CREATED=$(jq -r .created_at <<<"$QUALIFICATION")

          mkdir -p "$RUNNER_TEMP/qualification"
          gh run download "$QUALIFICATION_RUN_ID" \
            -R kody-w/rapp-canary \
            -p 'pre-grail-attestations-*' \
            -D "$RUNNER_TEMP/qualification"
          BETA_ATTESTATION=$(find "$RUNNER_TEMP/qualification" -name beta.json -type f)
          [[ "$(printf '%s\n' "$BETA_ATTESTATION" | sed '/^$/d' | wc -l | tr -d ' ')" == "1" ]]
          BETA_COMMIT=$(jq -r .payload.commit "$BETA_ATTESTATION")
          CANARY_ATTESTATION=$(find "$RUNNER_TEMP/qualification" -name canary.json -type f)
          [[ "$(printf '%s\n' "$CANARY_ATTESTATION" | sed '/^$/d' | wc -l | tr -d ' ')" == "1" ]]
          [[ "$(jq -r .head_sha <<<"$QUALIFICATION")" == "$(jq -r .payload.commit "$CANARY_ATTESTATION")" ]]

          BETA_PREFLIGHT=$(gh api \
            "repos/kody-w/rapp-beta/actions/runs/$BETA_PREFLIGHT_RUN_ID")
          [[ "$(jq -r .name <<<"$BETA_PREFLIGHT")" == "preflight" ]]
          [[ "$(jq -r .conclusion <<<"$BETA_PREFLIGHT")" == "success" ]]
          [[ "$(jq -r .path <<<"$BETA_PREFLIGHT")" == ".github/workflows/preflight.yml" ]]
          [[ "$(jq -r .event <<<"$BETA_PREFLIGHT")" == "push" ]]
          [[ "$(jq -r .head_branch <<<"$BETA_PREFLIGHT")" == "main" ]]
          [[ "$(jq -r .head_sha <<<"$BETA_PREFLIGHT")" == "$BETA_COMMIT" ]]
          BETA_PREFLIGHT_URL=$(jq -r .html_url <<<"$BETA_PREFLIGHT")
          BETA_PREFLIGHT_CREATED=$(jq -r .created_at <<<"$BETA_PREFLIGHT")

          MAX_AGE_HOURS=$(jq -r .max_candidate_age_hours .ring/preprod-policy.json)
          python3 - "$QUALIFICATION_CREATED" "$BETA_PREFLIGHT_CREATED" "$MAX_AGE_HOURS" <<'PY'
          from datetime import datetime, timedelta, timezone
          import sys

          now = datetime.now(timezone.utc)
          maximum = timedelta(hours=int(sys.argv[3]))
          for label, raw in (("qualification", sys.argv[1]), ("Beta preflight", sys.argv[2])):
              value = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              if value > now or now - value > maximum:
                  raise SystemExit(f"{label} evidence is stale or future-dated: {raw}")
          PY

          [[ "$ROLLBACK_REF" =~ ^brainstem-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git ls-remote --exit-code \
            https://github.com/kody-w/rapp-installer.git \
            "refs/tags/$ROLLBACK_REF" "refs/tags/$ROLLBACK_REF^{}" >/dev/null
          [[ "$SOAK_EVIDENCE_URL" == https://github.com/* ]]

          ENVIRONMENT=$(gh api \
            "repos/kody-w/rapp-canary/environments/preprod")
          REVIEWERS=$(jq '
            [.protection_rules[]
             | select(.type == "required_reviewers")
             | .reviewers[]] | length
          ' <<<"$ENVIRONMENT")
          MIN_REVIEWERS=$(jq -r .minimum_required_reviewers \
            .ring/preprod-policy.json)
          [[ "$REVIEWERS" -ge "$MIN_REVIEWERS" ]]
          [[ "$(jq -r .deployment_branch_policy.custom_branch_policies <<<"$ENVIRONMENT")" == "true" ]]
          BRANCH_POLICIES=$(gh api \
            "repos/kody-w/rapp-canary/environments/preprod/deployment-branch-policies")
          [[ "$(jq '[.branch_policies[] | select(.type == "branch" and .name == "main")] | length' \
            <<<"$BRANCH_POLICIES")" == "1" ]]

          echo "beta_commit=$BETA_COMMIT" >> "$GITHUB_OUTPUT"
          echo "qualification_url=$QUALIFICATION_URL" >> "$GITHUB_OUTPUT"
          echo "beta_preflight_url=$BETA_PREFLIGHT_URL" >> "$GITHUB_OUTPUT"

      - name: Export the exact qualified payload into a Grail-shaped candidate
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/kody-w/rapp-installer.git \
            "$RUNNER_TEMP/candidate"
          git -C "$RUNNER_TEMP/candidate" checkout -q \
            -b "preprod/run-$QUALIFICATION_RUN_ID"
          python .ring/tools/grail_gate.py verify \
            --run-id "$QUALIFICATION_RUN_ID" \
            --export-to "$RUNNER_TEMP/candidate"

      - name: Verify the archived rollback Brainstem frame
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preprod"
          python .ring/tools/brainstem_history.py verify-all \
            --repo "$RUNNER_TEMP/candidate" \
            --directory .ring/brainstem-history
          ROLLBACK_FRAME=".ring/brainstem-history/$ROLLBACK_REF.json"
          test -f "$ROLLBACK_FRAME"
          python .ring/tools/brainstem_history.py verify \
            --repo "$RUNNER_TEMP/candidate" \
            --frame "$ROLLBACK_FRAME"
          cp "$ROLLBACK_FRAME" "$RUNNER_TEMP/preprod/rollback-brainstem.json"

      - name: Package immutable candidate and readiness manifest
        id: package
        shell: bash
        env:
          BETA_COMMIT: ${{ steps.evidence.outputs.beta_commit }}
          QUALIFICATION_URL: ${{ steps.evidence.outputs.qualification_url }}
          BETA_PREFLIGHT_URL: ${{ steps.evidence.outputs.beta_preflight_url }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/preprod"
          mkdir -p "$OUT"
          ARTIFACT="rapp-preprod-${BETA_COMMIT:0:12}.tar.gz"
          python .ring/tools/preprod_gate.py package \
            --source "$RUNNER_TEMP/candidate" \
            --artifact "$OUT/$ARTIFACT" \
            --manifest "$OUT/readiness.json" \
            --beta-commit "$BETA_COMMIT" \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --qualification-url "$QUALIFICATION_URL" \
            --beta-preflight-run-id "$BETA_PREFLIGHT_RUN_ID" \
            --beta-preflight-url "$BETA_PREFLIGHT_URL" \
            --soak-evidence-url "$SOAK_EVIDENCE_URL" \
            --owner "$CANDIDATE_OWNER" \
            --control-plane-commit "$GITHUB_SHA" \
            --model-id "$MODEL_ID" \
            --rollback-ref "$ROLLBACK_REF" \
            --rollback-frame "$OUT/rollback-brainstem.json" \
            --expires-hours "$EXPIRES_HOURS"
          SHA=$(python -c \
            "import json; print(json.load(open('$OUT/readiness.json'))['subject']['artifact_sha256'])")
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Preprod candidate awaiting verification and approval"
            echo
            echo "- Beta commit: \`$BETA_COMMIT\`"
            echo "- Artifact: \`$ARTIFACT\`"
            echo "- SHA-256: \`$SHA\`"
            echo "- Rollback: \`$ROLLBACK_REF\`"
            echo "- Owner: \`$CANDIDATE_OWNER\`"
            echo "- Model: \`$MODEL_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preprod-candidate-${{ steps.evidence.outputs.beta_commit }}
          path: ${{ runner.temp }}/preprod/*
          if-no-files-found: error
          retention-days: 90

  verify:
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      MODEL_ID: ${{ inputs.model_id }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: preprod-candidate-${{ needs.stage.outputs.beta_commit }}
          path: ${{ runner.temp }}/preprod

      - name: Verify and exercise the immutable artifact
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.stage.outputs.artifact_name }}
          BETA_COMMIT: ${{ needs.stage.outputs.beta_commit }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          set -euo pipefail
          python .ring/tools/preprod_gate.py verify \
            --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            --manifest "$RUNNER_TEMP/preprod/readiness.json" \
            --expected-beta-commit "$BETA_COMMIT" \
            --expected-qualification-run "$QUALIFICATION_RUN_ID"
          mkdir -p "$RUNNER_TEMP/candidate"
          tar -xzf "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            -C "$RUNNER_TEMP/candidate"
          python -m pip install --quiet \
            -r "$RUNNER_TEMP/candidate/rapp_brainstem/requirements.txt" pytest
          (
            cd "$RUNNER_TEMP/candidate"
            GITHUB_MODEL="$MODEL_ID" bash tests/test_installer.sh
          )

      - name: Parse Windows PowerShell 5.1 installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:RUNNER_TEMP\candidate\install.ps1",
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }

  dependencies:
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: preprod-candidate-${{ needs.stage.outputs.beta_commit }}
          path: ${{ runner.temp }}/preprod

      - name: Resolve without executing dependency code
        id: dependencies
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.stage.outputs.artifact_name }}
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          CANDIDATE="$RUNNER_TEMP/candidate"
          MATERIAL="$RUNNER_TEMP/dependency-$KEY"
          mkdir -p "$CANDIDATE" "$MATERIAL/wheelhouse"
          tar -xzf "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" -C "$CANDIDATE"
          REQUIREMENTS="$CANDIDATE/rapp_brainstem/requirements.txt"
          python - "$REQUIREMENTS" <<'PY'
          import pathlib
          import sys

          for raw in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("-") or "@" in line or "://" in line:
                  raise SystemExit(f"unsafe dependency source: {line}")
          PY
          python -m pip install --quiet --upgrade pip
          python -m pip install --dry-run --ignore-installed --only-binary=:all: \
            --report "$MATERIAL/resolution.json" -r "$REQUIREMENTS"
          python - "$MATERIAL/resolution.json" "$MATERIAL/requirements.lock" <<'PY'
          import json
          import pathlib
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          pins = sorted(
              f"{item['metadata']['name']}=={item['metadata']['version']}"
              for item in report.get("install", [])
          )
          pathlib.Path(sys.argv[2]).write_text(
              "\n".join(pins) + "\n",
              encoding="utf-8",
          )
          PY
          python -m pip download --quiet --only-binary=:all: \
            --dest "$MATERIAL/wheelhouse" \
            -r "$MATERIAL/requirements.lock"
          python -m pip install --quiet pip-audit==2.10.1
          python -m pip_audit \
            -r "$MATERIAL/requirements.lock" \
            --no-deps \
            --format json \
            --output "$MATERIAL/vulnerability-report.json"
          python - "$MATERIAL" "$KEY" <<'PY'
          import email
          import hashlib
          import json
          import pathlib
          import platform
          import sys
          import zipfile

          root = pathlib.Path(sys.argv[1])
          files = {}
          licenses = {}
          blocked = []
          for path in sorted((root / "wheelhouse").iterdir()):
              files[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
              if path.suffix != ".whl":
                  blocked.append({"file": path.name, "reason": "non-wheel dependency"})
                  continue
              with zipfile.ZipFile(path) as wheel:
                  metadata_name = next(
                      (name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")),
                      None,
                  )
                  if not metadata_name:
                      blocked.append({"file": path.name, "reason": "missing metadata"})
                      continue
                  metadata = email.message_from_bytes(wheel.read(metadata_name))
              declared = (
                  metadata.get("License-Expression")
                  or metadata.get("License")
                  or "; ".join(metadata.get_all("Classifier", []))
              ).strip()
              if not declared or declared.upper() in {"UNKNOWN", "NONE"}:
                  blocked.append({"file": path.name, "reason": "unknown license"})
              if "AGPL" in declared.upper():
                  blocked.append({"file": path.name, "reason": declared})
              licenses[path.name] = declared
          value = {
              "schema": "rapp-dependency-materials/1",
              "platform": sys.argv[2],
              "python_version": f"{sys.version_info.major}.{sys.version_info.minor}",
              "architecture": platform.machine().lower(),
              "requirements": root.joinpath("requirements.lock").read_text().splitlines(),
              "files": files,
          }
          root.joinpath("sbom.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          license_report = {
              "schema": "rapp-license-report/1",
              "platform": sys.argv[2],
              "licenses": licenses,
              "blocked": blocked,
          }
          root.joinpath("licenses.json").write_text(
              json.dumps(license_report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if blocked:
              raise SystemExit(f"blocked dependency licenses: {blocked}")
          PY
          ARCHIVE="$RUNNER_TEMP/dependency-material-$KEY.tar.gz"
          python .ring/tools/preprod_gate.py bundle \
            --source "$MATERIAL" \
            --artifact "$ARCHIVE"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preprod-dependencies-${{ needs.stage.outputs.beta_commit }}-${{ steps.dependencies.outputs.key }}
          path: ${{ steps.dependencies.outputs.archive }}
          if-no-files-found: error
          retention-days: 90

      - name: Test with the frozen dependency material
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          MATERIAL="$RUNNER_TEMP/dependency-$KEY"
          TEST_VENV="$RUNNER_TEMP/sealed-runtime"
          python -m venv "$TEST_VENV"
          if [ "$RUNNER_OS" = "Windows" ]; then
            TEST_PY="$TEST_VENV/Scripts/python.exe"
            export PATH="$TEST_VENV/Scripts:$PATH"
          else
            TEST_PY="$TEST_VENV/bin/python"
            export PATH="$TEST_VENV/bin:$PATH"
          fi
          "$TEST_PY" -m pip install \
            --no-index \
            --find-links "$MATERIAL/wheelhouse" \
            -r "$MATERIAL/requirements.lock"
          (
            cd "$RUNNER_TEMP/candidate"
            bash tests/test_installer.sh
          )

  drill:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      ROLLBACK_REF: ${{ inputs.rollback_ref }}
      MODEL_ID: ${{ inputs.model_id }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: preprod-candidate-${{ needs.stage.outputs.beta_commit }}
          path: ${{ runner.temp }}/preprod

      - name: Recreate the exact artifact as a candidate repository
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.stage.outputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          tar -xzf "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            -C "$RUNNER_TEMP/candidate"
          git -C "$RUNNER_TEMP/candidate" init -q
          git -C "$RUNNER_TEMP/candidate" config user.name "Preprod Gate"
          git -C "$RUNNER_TEMP/candidate" config user.email "preprod@rapp.invalid"
          git -C "$RUNNER_TEMP/candidate" add -A
          git -C "$RUNNER_TEMP/candidate" commit -qm "immutable preprod candidate"
          git -C "$RUNNER_TEMP/candidate" remote add origin \
            https://github.com/kody-w/rapp-installer.git
          git -C "$RUNNER_TEMP/candidate" fetch --quiet origin main

      - name: Exercise fresh, upgrade, and destructive repair
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          GITHUB_MODEL="$MODEL_ID" PREFLIGHT_PORT=17401 bash tests/preflight_local.sh fresh
          GITHUB_MODEL="$MODEL_ID" PREFLIGHT_PORT=17402 bash tests/preflight_local.sh upgrade
          GITHUB_MODEL="$MODEL_ID" PREFLIGHT_PORT=17403 bash tests/preflight_local.sh repair

      - name: Rehearse the immutable rollback installer
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_HOME="$RUNNER_TEMP/rollback-home"
          SHIMS="$RUNNER_TEMP/rollback-shims"
          mkdir -p "$ROLLBACK_HOME" "$SHIMS"
          cat > "$SHIMS/lsof" <<'EOF'
          #!/bin/bash
          exit 0
          EOF
          cat > "$SHIMS/open" <<'EOF'
          #!/bin/bash
          exit 0
          EOF
          cat > "$SHIMS/curl" <<'EOF'
          #!/bin/bash
          for arg in "$@"; do
            case "$arg" in
              *github.com/login/*|*api.github.com/copilot_internal/*|*raw.githubusercontent.com*) exit 6 ;;
            esac
          done
          exec /usr/bin/curl "$@"
          EOF
          chmod +x "$SHIMS/lsof" "$SHIMS/open" "$SHIMS/curl"

          git clone --quiet --depth 1 --branch "$ROLLBACK_REF" \
            https://github.com/kody-w/rapp-installer.git \
            "$RUNNER_TEMP/rollback-source"
          EXPECTED_VERSION=$(tr -d '[:space:]' \
            < "$RUNNER_TEMP/rollback-source/rapp_brainstem/VERSION")
          mkdir -p "$ROLLBACK_HOME/.brainstem/state"
          printf '{"access_token":"ghu_PREPROD_ROLLBACK","saved_at":1}\n' \
            > "$ROLLBACK_HOME/.brainstem/state/.copilot_token"
          printf 'preprod-rollback-secret\n' \
            > "$ROLLBACK_HOME/.brainstem/state/.brainstem_secret"
          printf '{"model":"gpt-4o"}\n' \
            > "$ROLLBACK_HOME/.brainstem/state/.brainstem_model"
          printf '[{"type":"preprod-rollback-marker"}]\n' \
            > "$ROLLBACK_HOME/.brainstem/state/.brainstem_book.json"

          (
            export HOME="$ROLLBACK_HOME"
            export PATH="$SHIMS:$PATH"
            export PORT=17404
            export BRAINSTEM_VERSION="$ROLLBACK_REF"
            script -qec "bash '$RUNNER_TEMP/candidate/install.sh'" \
              "$RUNNER_TEMP/rollback-install.log"
          ) &
          INSTALLER_PID=$!
          trap 'kill "$INSTALLER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 90); do
            sleep 2
            if /usr/bin/curl -sf --max-time 2 \
                http://localhost:17404/health \
                -o "$RUNNER_TEMP/rollback-health.json"; then
              break
            fi
            if [ "$attempt" = 90 ]; then
              tail -80 "$RUNNER_TEMP/rollback-install.log" || true
              exit 1
            fi
          done
          python3 - "$RUNNER_TEMP/rollback-health.json" "$EXPECTED_VERSION" <<'PY'
          import json
          import sys
          value = json.load(open(sys.argv[1]))
          assert value["version"] == sys.argv[2], value
          print("rollback booted:", value["version"])
          PY
          LEGACY="$ROLLBACK_HOME/.brainstem/src/rapp_brainstem"
          grep -q "ghu_PREPROD_ROLLBACK" "$LEGACY/.copilot_token"
          grep -q "preprod-rollback-secret" "$LEGACY/.brainstem_secret"
          grep -q "gpt-4o" "$LEGACY/.brainstem_model"
          grep -q "preprod-rollback-marker" "$LEGACY/.brainstem_book.json"

          LISTENER=$(lsof -ti tcp:17404 -sTCP:LISTEN 2>/dev/null | head -1 || true)
          [ -z "$LISTENER" ] || kill "$LISTENER"
          wait "$INSTALLER_PID" 2>/dev/null || true
          trap - EXIT

  seal:
    needs:
      - stage
      - verify
      - dependencies
      - drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    environment:
      name: preprod
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: preprod-candidate-${{ needs.stage.outputs.beta_commit }}
          path: ${{ runner.temp }}/preprod

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: preprod-dependencies-${{ needs.stage.outputs.beta_commit }}-*
          path: ${{ runner.temp }}/preprod/dependencies
          merge-multiple: true

      - name: Re-verify after approval
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.stage.outputs.artifact_name }}
          BETA_COMMIT: ${{ needs.stage.outputs.beta_commit }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          MATERIAL_ARGS=()
          for material in "$RUNNER_TEMP/preprod/dependencies/"*.tar.gz; do
            name=$(basename "$material" .tar.gz)
            MATERIAL_ARGS+=(--material "$name=$material")
          done
          python .ring/tools/preprod_gate.py verify \
            --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            --manifest "$RUNNER_TEMP/preprod/readiness.json" \
            --expected-beta-commit "$BETA_COMMIT" \
            --expected-qualification-run "$QUALIFICATION_RUN_ID"
          python .ring/tools/preprod_gate.py seal \
            --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            --manifest "$RUNNER_TEMP/preprod/readiness.json" \
            --output "$RUNNER_TEMP/preprod/seaworthy.json" \
            --preprod-run-id "${{ github.run_id }}" \
            --preprod-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --approval-authority "github-environment:preprod" \
            "${MATERIAL_ARGS[@]}"
          python .ring/tools/preprod_gate.py verify \
            --artifact "$RUNNER_TEMP/preprod/$ARTIFACT_NAME" \
            --manifest "$RUNNER_TEMP/preprod/seaworthy.json" \
            --expected-beta-commit "$BETA_COMMIT" \
            --expected-qualification-run "$QUALIFICATION_RUN_ID" \
            "${MATERIAL_ARGS[@]}"

      - name: Attest immutable Preprod artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/preprod/${{ needs.stage.outputs.artifact_name }}

      - name: Attest sealed readiness manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/preprod/seaworthy.json

      - name: Attest sealed dependency materials
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/preprod/dependencies/*.tar.gz

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: seaworthy-preprod-${{ needs.stage.outputs.beta_commit }}
          path: |
            ${{ runner.temp }}/preprod/${{ needs.stage.outputs.artifact_name }}
            ${{ runner.temp }}/preprod/seaworthy.json
            ${{ runner.temp }}/preprod/rollback-brainstem.json
            ${{ runner.temp }}/preprod/dependencies/*.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Record the seaworthy handoff
        shell: bash
        env:
          CANDIDATE_OWNER: ${{ inputs.owner }}
          SOAK_EVIDENCE_URL: ${{ inputs.soak_evidence_url }}
          ROLLBACK_REF: ${{ inputs.rollback_ref }}
        run: |
          {
            echo "## Preprod candidate sealed"
            echo
            echo "- Beta commit: \`${{ needs.stage.outputs.beta_commit }}\`"
            echo "- Artifact: \`${{ needs.stage.outputs.artifact_name }}\`"
            echo "- SHA-256: \`${{ needs.stage.outputs.artifact_sha256 }}\`"
            echo "- Qualification run: \`${{ inputs.qualification_run_id }}\`"
            echo "- Rollback target: \`$ROLLBACK_REF\`"
            echo "- Owner: \`$CANDIDATE_OWNER\`"
            echo "- Soak evidence: $SOAK_EVIDENCE_URL"
            echo
            echo "Grail must consume this exact artifact digest. Any byte change requires a new qualification."
          } >> "$GITHUB_STEP_SUMMARY"
