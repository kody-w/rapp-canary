name: Bug Report
description: Report a reproducible RAPP Installer or Brainstem problem
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - macOS / Linux installer
        - Windows installer
        - Brainstem runtime
        - Authentication
        - Azure deployment
        - Copilot Studio integration
        - Scout / Copilot plugin
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and redacted logs
      placeholder: |
        - OS:
        - Python:
        - Install or upgrade path:
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, private source, and personal data.
          required: true
